version: '3.3'

services:
  delta-rwa-trader:
    build: .
    container_name: delta_rwa_trader
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./agents:/app/agents
      - ./web:/app/web
      - ./data:/app/data
      - ./config.py:/app/config.py
      - ./delta_client.py:/app/delta_client.py
      - ./server.py:/app/server.py
      - ./tests:/app/tests
      - ./run.py:/app/run.py
    environment:
      - PYTHONUNBUFFERED=1
      - HOST=0.0.0.0
